name: FobbitMC pinned release artifacts

on:
  workflow_dispatch:
    inputs:
      engine_sha:
        description: Exact 40-character Alb11747/Pumpkin commit
        required: true
        type: string
      bridge_sha:
        description: Exact 40-character Alb11747/PatchBukkit commit pinned to engine_sha
        required: true
        type: string
      build_exporter:
        description: Build reviewed code-only exporter vendored in the selected workflow commit
        default: false
        type: boolean
      exporter_sha:
        description: Exact original exporter commit recorded in vendored source provenance
        required: false
        type: string
      autosave_baseline_sha:
        description: Optional exact test-only engine commit expected to fail the autosave regression
        required: false
        type: string

      merchant_baseline_sha:
        description: Exact test-only baseline expected to fail the merchant callback regression
        required: false
        type: string

      persistence_baseline_sha:
        description: Exact test-only baseline expected to lose the neighboring entity during unload
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: fobbitmc-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_OPT_LEVEL: 3
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
  CARGO_PROFILE_RELEASE_DEBUG: 0
  CARGO_PROFILE_RELEASE_STRIP: debuginfo
  RUSTFLAGS: ""
  RUST_TOOLCHAIN: 1.99.0
  ENGINE_SHA: ${{ inputs.engine_sha }}
  BRIDGE_SHA: ${{ inputs.bridge_sha }}
  EXPORTER_SHA: ${{ inputs.exporter_sha }}
  BUILD_EXPORTER: ${{ inputs.build_exporter }}
  AUTOSAVE_BASELINE_SHA: ${{ inputs.autosave_baseline_sha }}
  MERCHANT_BASELINE_SHA: ${{ inputs.merchant_baseline_sha }}
  PERSISTENCE_BASELINE_SHA: ${{ inputs.persistence_baseline_sha }}

jobs:
  release:
    if: github.repository == 'Alb11747/Pumpkin'
    name: Matched release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep checked-out source bytes identical on both runner platforms
        run: git config --global core.autocrlf false
      - name: Validate immutable inputs
        run: |
          [[ "$ENGINE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BRIDGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ -n "$AUTOSAVE_BASELINE_SHA" ]]; then
            [[ "$AUTOSAVE_BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]]
          fi
          if [[ -n "$MERCHANT_BASELINE_SHA" ]]; then
            [[ "$MERCHANT_BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]]
          fi
          if [[ -n "$PERSISTENCE_BASELINE_SHA" ]]; then
            [[ "$PERSISTENCE_BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]]
          fi
          if [[ "$BUILD_EXPORTER" == true ]]; then
            [[ "$EXPORTER_SHA" =~ ^[0-9a-f]{40}$ ]]
          fi
      - name: Checkout workflow and verification helper
        uses: actions/checkout@v7
        with:
          path: build-control
          persist-credentials: false
      - name: Checkout exact engine
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.engine_sha }}
          path: engine
          persist-credentials: false
          submodules: recursive
      - name: Checkout exact bridge
        uses: actions/checkout@v7
        with:
          repository: Alb11747/PatchBukkit
          ref: ${{ inputs.bridge_sha }}
          path: bridge
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install exact shared Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --target '${{ matrix.target }}'
          rustup default "$RUST_TOOLCHAIN"
          rustc +"$RUST_TOOLCHAIN" -Vv
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: zulu
      - name: Verify sources, engine pins and native API; prepare optional exporter
        run: python build-control/.github/scripts/fobbitmc_release.py prepare '${{ matrix.target }}'
      - name: Prove the test-only baseline fails on the autosave assertion
        if: inputs.autosave_baseline_sha != ''
        working-directory: engine
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/fobbitmc-release-target
        run: |
          git fetch --depth=1 origin "$AUTOSAVE_BASELINE_SHA"
          git checkout --detach "$AUTOSAVE_BASELINE_SHA"
          TEST='world::tests::automatic_save_persists_live_clock_and_rules_only_when_enabled'
          LOG="$RUNNER_TEMP/autosave-negative-${{ matrix.target }}.log"
          set +e
          cargo +"$RUST_TOOLCHAIN" test --locked --release --target '${{ matrix.target }}' -p pumpkin-core "$TEST" -- --exact --color never > "$LOG" 2>&1
          STATUS=$?
          set -e
          cat "$LOG"
          [[ "$STATUS" -eq 101 ]]
          grep -Fx 'running 1 test' "$LOG"
          grep -Fx "test $TEST ... FAILED" "$LOG"
          grep -F 'autosave must commit live metadata before shutdown' "$LOG"
          grep -E '^test result: FAILED\. 0 passed; 1 failed; 0 ignored; 0 measured; [0-9]+ filtered out;' "$LOG"
          cd ..
          python build-control/.github/scripts/fobbitmc_release.py autosave_negative
      - name: Restore and verify the exact engine source after the negative gate
        if: always() && inputs.autosave_baseline_sha != ''
        run: |
          git -C engine checkout --detach "$ENGINE_SHA"
          python build-control/.github/scripts/fobbitmc_release.py verify_engine
      - name: Prove the test-only baseline fails on the merchant callback assertion
        if: inputs.merchant_baseline_sha != ''
        working-directory: engine
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/fobbitmc-release-target
        run: |
          git fetch --depth=1 origin "$MERCHANT_BASELINE_SHA"
          git checkout --detach "$MERCHANT_BASELINE_SHA"
          cd ..
          python build-control/.github/scripts/fobbitmc_release.py merchant_negative '${{ matrix.target }}'
      - name: Restore and verify exact engine after merchant negative gate
        if: always() && inputs.merchant_baseline_sha != ''
        run: |
          git -C engine checkout --detach "$ENGINE_SHA"
          python build-control/.github/scripts/fobbitmc_release.py verify_engine
      - name: Prove the exact merchant regression passes on the restored engine
        working-directory: engine
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/fobbitmc-release-target
        run: |
          TEST='entity::passive::villager::tests::successful_trade_player_click_returns_and_preserves_payment'
          LOG="$RUNNER_TEMP/merchant-positive-${{ matrix.target }}.log"
          set +e
          cargo +"$RUST_TOOLCHAIN" test --locked --release --target '${{ matrix.target }}' -p pumpkin-core --lib "$TEST" -- --exact --color never > "$LOG" 2>&1
          STATUS=$?
          set -e
          cat "$LOG"
          [[ "$STATUS" -eq 0 ]]
          grep -Fx 'running 1 test' "$LOG"
          grep -Fx "test $TEST ... ok" "$LOG"
          grep -E '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out;' "$LOG"
      - name: Prove the test-only baseline fails on neighboring entity loss
        if: inputs.persistence_baseline_sha != ''
        working-directory: engine
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/fobbitmc-release-target
        run: |
          git fetch --depth=1 origin "$PERSISTENCE_BASELINE_SHA"
          git checkout --detach "$PERSISTENCE_BASELINE_SHA"
          cd ..
          python build-control/.github/scripts/fobbitmc_release.py persistence_negative '${{ matrix.target }}'
      - name: Restore and verify exact engine after persistence negative gate
        if: always() && inputs.persistence_baseline_sha != ''
        run: |
          git -C engine checkout --detach "$ENGINE_SHA"
          python build-control/.github/scripts/fobbitmc_release.py verify_engine
      - name: Prove the four entity snapshot regressions and assigned workstation restock
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/fobbitmc-release-target
        run: python build-control/.github/scripts/fobbitmc_release.py positive '${{ matrix.target }}' entity-persistence
      - name: Prove entity crossing in three fresh test processes
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/fobbitmc-release-target
        run: python build-control/.github/scripts/fobbitmc_release.py positive '${{ matrix.target }}' entity-crossing-repeat
      - name: Prove save-lineage scheduler counts and FIFO context
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/fobbitmc-release-target
        run: python build-control/.github/scripts/fobbitmc_release.py positive '${{ matrix.target }}' save-scheduler
      - name: Prove save-lineage console context in its own test process
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/fobbitmc-release-target
        run: python build-control/.github/scripts/fobbitmc_release.py positive '${{ matrix.target }}' save-console
      - name: Prove all three named intangible-projectile wire tests
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/fobbitmc-release-target
        run: python build-control/.github/scripts/fobbitmc_release.py positive '${{ matrix.target }}' intangible
      - name: Prove all five named charged-projectile wire tests
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/fobbitmc-release-target
        run: python build-control/.github/scripts/fobbitmc_release.py positive '${{ matrix.target }}' charged
      - name: Prove named merchant stock equipment and autosave preservation gates
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/fobbitmc-release-target
        run: python build-control/.github/scripts/fobbitmc_release.py positive '${{ matrix.target }}' preservation
      - name: Check every core and protocol target and feature with release Clippy
        working-directory: engine
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/fobbitmc-release-target
        run: cargo +"$RUST_TOOLCHAIN" clippy --locked --release --target '${{ matrix.target }}' -p pumpkin-core -p pumpkin-protocol --all-targets --all-features -- -D warnings
      - name: Build optimized engine
        working-directory: engine
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/fobbitmc-release-target
        run: cargo +"$RUST_TOOLCHAIN" build --locked --release --target '${{ matrix.target }}' -p pumpkin
      - name: Test all workspace libraries in the matching release profile
        working-directory: engine
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/fobbitmc-release-target
        run: cargo +"$RUST_TOOLCHAIN" test --locked --release --target '${{ matrix.target }}' --workspace --lib
      - name: Retain engine and release its temporary Cargo products
        run: python build-control/.github/scripts/fobbitmc_release.py collect engine '${{ matrix.target }}'
      - name: Build bridge JAR and verify death mapping before embedding it in the native library
        working-directory: bridge/java
        run: bash ./gradlew --no-daemon :patchbukkit:jar :patchbukkit:test --tests org.patchbukkit.events.EntityDeathMappingTest
      - name: Build optimized native bridge
        working-directory: bridge/rust
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/fobbitmc-release-target
        run: cargo +"$RUST_TOOLCHAIN" build --locked --release --target '${{ matrix.target }}' --lib
      - name: Test native bridge library in the matching release profile
        working-directory: bridge/rust
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/fobbitmc-release-target
        run: cargo +"$RUST_TOOLCHAIN" test --locked --release --target '${{ matrix.target }}' --lib
      - name: Retain bridge and embedded JAR; release temporary Cargo products
        run: python build-control/.github/scripts/fobbitmc_release.py collect bridge '${{ matrix.target }}'
      - name: Build optimized native exporter
        if: inputs.build_exporter
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/fobbitmc-release-target
        run: cargo +"$RUST_TOOLCHAIN" build --manifest-path "$RUNNER_TEMP/fobbitmc-bluemap/Cargo.toml" --locked --release --target '${{ matrix.target }}' --lib
      - name: Test native exporter library in the matching release profile
        if: inputs.build_exporter
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/fobbitmc-release-target
        run: cargo +"$RUST_TOOLCHAIN" test --manifest-path "$RUNNER_TEMP/fobbitmc-bluemap/Cargo.toml" --locked --release --target '${{ matrix.target }}' --lib
      - name: Retain exporter and release temporary Cargo products
        if: inputs.build_exporter
        run: python build-control/.github/scripts/fobbitmc_release.py collect exporter '${{ matrix.target }}'
      - name: Verify Linux glibc ceiling and write artifact manifest
        run: python build-control/.github/scripts/fobbitmc_release.py manifest '${{ matrix.target }}'
      - name: Upload matched artifacts and provenance
        uses: actions/upload-artifact@v7
        with:
          name: fobbitmc-${{ matrix.target }}-${{ inputs.engine_sha }}
          path: dist/*
          if-no-files-found: error
      - name: Retain failed qualification output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fobbitmc-failure-logs-${{ matrix.target }}-${{ inputs.engine_sha }}
          path: ${{ runner.temp }}/*-${{ matrix.target }}.log
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
