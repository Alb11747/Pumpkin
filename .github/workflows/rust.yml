name: Pumpkin contribution verification

on:
  workflow_dispatch:
    inputs:
      region_ref:
        type: string
        required: true
        default: 6d10390d3d8f5835313c1eab5294ac71f1972360
      teleport_ref:
        type: string
        required: true
        default: 33734b626d97ffdab36a9a28a2cdc9969960444f

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.kind }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: region
            os: ubuntu-latest
            package: pumpkin-world
            regression: chunk::io::file_manager::tests::anvil_entity_save_and_reload_fit_on_a_one_mib_stack
          - kind: region
            os: windows-latest
            package: pumpkin-world
            regression: chunk::io::file_manager::tests::anvil_entity_save_and_reload_fit_on_a_one_mib_stack
          - kind: teleport
            os: ubuntu-latest
            package: pumpkin-core
            regression: entity::player::tests::same_world_teleport_moves_chunk_view_before_client_confirmation_or_movement
          - kind: teleport
            os: windows-latest
            package: pumpkin-core
            regression: entity::player::tests::same_world_teleport_moves_chunk_view_before_client_confirmation_or_movement
    defaults:
      run:
        shell: bash
    env:
      RUSTFLAGS: -Dwarnings
      CARGO_TERM_COLOR: always
      CONTRIBUTION_KIND: ${{ matrix.kind }}
      CONTRIBUTION_PACKAGE: ${{ matrix.package }}
      CONTRIBUTION_TEST: ${{ matrix.regression }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Retain verification helper outside the source checkout
        run: python -c 'import os,shutil; shutil.copyfile(".github/scripts/contribution_negative.py", os.path.join(os.environ["RUNNER_TEMP"], "contribution_negative.py"))'
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.kind == 'region' && inputs.region_ref || inputs.teleport_ref }}
          fetch-depth: 0
          submodules: recursive
      - name: Record exact source identity
        run: git log -1 --format='%H %s'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: contribution-debug-${{ runner.os }}-${{ runner.arch }}
      - name: Formatting
        run: cargo fmt --check
      - name: Fixed regression
        id: fixed
        run: cargo test --locked -p "$CONTRIBUTION_PACKAGE" "$CONTRIBUTION_TEST" -- --exact --nocapture
      - name: Identical-test upstream negative control
        if: ${{ !cancelled() && steps.fixed.outcome == 'success' }}
        run: python "$RUNNER_TEMP/contribution_negative.py"
      - name: Affected crate tests and documentation
        if: ${{ !cancelled() && steps.fixed.outcome == 'success' }}
        run: cargo test --locked -p "$CONTRIBUTION_PACKAGE"
      - name: Affected crate Clippy
        if: ${{ !cancelled() && steps.fixed.outcome == 'success' }}
        run: cargo clippy --locked -p "$CONTRIBUTION_PACKAGE" --all-targets --all-features -- -D warnings
      - name: No source changes left by counterfactual
        if: always()
        run: git diff --exit-code
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: contribution-proof-${{ matrix.kind }}-${{ matrix.os }}
          path: ${{ runner.temp }}/contribution-proof
          if-no-files-found: ignore
